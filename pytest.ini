[pytest]
# ROS (source /opt/ros/*/setup.bash) добавляет в PYTHONPATH pytest-плагины launch_testing и launch_ros,
# которые роняют сбор тестов (нет lark, неизвестный хук); там, где их нет, блокировка ни на что не влияет
addopts = -p no:launch_testing -p no:launch_ros -rs
markers =
    gpu: уровень 3 test_pipeline.py — нужна CUDA, единицы минут, один раз перед стартом обучения
    slow: читает весь датасет целиком (test_pipeline.py)
    soft: метка vs episode_stats, не блокирует (validate_dataset.py)
