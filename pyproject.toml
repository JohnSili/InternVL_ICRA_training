[project]
name = "vlmfinetuning"
version = "0.1.0"
description = "InternVL3-2B LoRA fine-tuning for robot-manipulation error classification"
requires-python = ">=3.10,<3.13"
# Одно окружение на подготовку данных, оценку, тесты и обучение. Версии transformers/peft/accelerate/
# numpy/tokenizers взяты из InternVL/requirements/internvl_chat.txt: тренер InternVL написан под них
# (transformers >= 4.46 уже не принимает --evaluation_strategy, который использует его эталонный скрипт).
dependencies = [
    # torch 2.9 + CUDA 12.8, а не самый свежий: только под эту пару есть готовое колесо flash-attn
    # (Dao-AILab собирает до torch 2.10, под CUDA 13 — только aarch64), а собирать его из исходников
    # это час компиляции и неизвестный исход на новых torch/CUDA.
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.37.2",
    "tokenizers==0.15.1",
    "peft==0.10.0",
    "accelerate<1",
    "numpy<2",
    "timm>=0.9.12",
    "einops>=0.6.1",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
    "huggingface-hub>=0.23,<1",
    "pillow>=10",
    "eva-decord>=0.6.1",    # модуль decord: internvl.train.dataset импортирует его безусловно; у оригинального decord кривые теги wheel, uv переустанавливал его каждый запуск
    "opencv-python>=4.8",
    "imageio>=2.31",
    "datasets>=2.16",       # internvl.patch импортирует безусловно
    "orjson>=3.9",
    "tensorboard>=2.15",
    "pytest>=8",
]

[project.optional-dependencies]
# Ставятся вторым шагом, когда torch уже в .venv (их setup.py импортирует torch):
#   uv sync && uv sync --extra train --extra flash
train = ["deepspeed>=0.14"]      # нужен nvcc: setup.py требует CUDA_HOME даже без сборки ops
# Готовое колесо под cp312/x86_64/torch2.9/cu12: ставится за секунды, ничего не компилирует.
# Тренер InternVL импортирует flash_attn безусловно, без него не стартует.
flash = ["flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl"]

[tool.uv]
package = false
no-build-isolation-package = ["deepspeed"]
